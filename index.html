<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Replenish for Work - Zyklus- & Nachbestellungsplaner für Betriebs- & Praxisbedarf</title>
    <meta name="description" content="Kostenloser Zyklus- und Nachbestellungsplaner für Arbeitsplätze, Praxen, Gastronomie und Betriebe. Beugen Sie Engpässen vor mit automatischer Vorlaufzeitberechnung." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#047857" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReplenishWork" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
